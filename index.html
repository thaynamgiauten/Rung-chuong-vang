<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Giơ Thẻ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky chalkboard-green top bar with step tabs; each tab is one working surface; live session = question left, scanner right (stacks on phones). */
:root{
  --bg:#eef1ec; --surface:#ffffff; --surface-2:#f5f7f3; --ink:#17251f; --muted:#5b6a62; --line:#d4dcd5;
  --board:#1f4a3c; --board-ink:#f3f6f1; --accent:#1f6b52; --chalk:#f2c84b; --chalk-ink:#3a2d00;
  --ok:#2e8a57; --ok-soft:#dff1e6; --bad:#c2453a; --bad-soft:#f8e1de; --idle:#e3e8e3;
  --a:#d9573f; --b:#2f6fd0; --c:#2e9a5f; --d:#9a5bd0;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#17211c; --surface-2:#1c2822; --ink:#e5ece7; --muted:#97a69e; --line:#2b3a33;
  --board:#13342a; --board-ink:#eef3ef; --accent:#62b892; --chalk:#f2c84b; --chalk-ink:#2e2400;
  --ok:#55c084; --ok-soft:#1d3a2a; --bad:#ec7468; --bad-soft:#41231f; --idle:#26332d;
  --a:#f07a62; --b:#6ea0f0; --c:#5cc58a; --d:#bb8cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#17211c; --surface-2:#1c2822; --ink:#e5ece7; --muted:#97a69e; --line:#2b3a33;
  --board:#13342a; --board-ink:#eef3ef; --accent:#62b892; --chalk:#f2c84b; --chalk-ink:#2e2400;
  --ok:#55c084; --ok-soft:#1d3a2a; --bad:#ec7468; --bad-soft:#41231f; --idle:#26332d;
  --a:#f07a62; --b:#6ea0f0; --c:#5cc58a; --d:#bb8cf0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink);padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:7px;background:#fff;display:grid;place-items:center}
.logo h1{font-size:1.2rem;letter-spacing:.01em}
.logo small{display:block;font-family:var(--f-body);font-size:.75rem;opacity:.75;font-weight:500}
.sync{font-size:.78rem;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--chalk);display:inline-block}
.sync.on i{background:#6fe0a6}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--board-ink);opacity:.72;padding:9px 14px 11px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:8px;font-size:.9rem}
.tab b{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.tab[aria-selected="true"] b{background:var(--chalk);color:var(--chalk-ink)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}

main{padding-block:22px 60px}
#view{display:grid;gap:18px}
@media (max-width:860px){#scanPanel{order:-1}}
.view{display:grid;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;align-items:start}
.grid-live{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2,.grid-live{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1a13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1a13}}
.btn.chalk{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.big{padding:13px 20px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:120px;font-size:.9rem}
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:600}
.pill{font-size:.74rem;padding:2px 8px;border-radius:99px;background:var(--idle);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ex{background:var(--chalk);color:var(--chalk-ink)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{background:color-mix(in srgb,var(--chalk) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--chalk) 60%,var(--line));border-radius:8px;padding:10px 12px;font-size:.88rem}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td input{background:transparent;border:1px solid transparent;padding:3px 6px}
td input:hover,td input:focus{border-color:var(--line);background:var(--surface-2)}

/* Quiz editor */
.q{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.q-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-h b{font-family:var(--f-display)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:6px;align-items:center}
.opt .L{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff;cursor:pointer;opacity:.45;border:0}
.opt .L.on{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ok)}
.La{background:var(--a)}.Lb{background:var(--b)}.Lc{background:var(--c)}.Ld{background:var(--d)}

/* Cards preview */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cards canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Live session */
.sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:10px 14px}
.sbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--board-ink)}
.sbar .btn.chalk{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.qnum{font-family:var(--f-mono);font-weight:700}
.qtext{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.35}
.ans{display:grid;gap:8px}
.ans .a{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.ans .a .L{opacity:1;cursor:default}
.ans .a.correct{border-color:var(--ok);background:var(--ok-soft)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:8px}
.bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:4px}
.bar .v{font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.bar .track{display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{width:100%;border-radius:6px 6px 0 0;transition:height .35s ease}
.bar .k{font-family:var(--f-mono);font-weight:700}
.bar.correct .k{color:var(--ok)}
.stat{display:flex;align-items:baseline;gap:8px}
.stat .n{font-family:var(--f-mono);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:99px;background:var(--idle);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.chip{display:flex;gap:6px;align-items:center;padding:5px 8px;border-radius:7px;background:var(--idle);font-size:.8rem;min-width:0}
.chip .no{font-family:var(--f-mono);font-weight:700;font-size:.74rem;min-width:20px}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip .x{font-family:var(--f-mono);font-weight:700}
.chip.got{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.chip.ok{background:var(--ok-soft)} .chip.ok .x{color:var(--ok)}
.chip.no-{background:var(--bad-soft)} .chip.no- .x{color:var(--bad)}
.shot{position:relative;border-radius:8px;overflow:hidden;background:#000}
.shot canvas,.shot video{display:block;width:100%;height:auto}
.scanmsg{font-weight:600}
.hide-hint .hint{display:none}

/* Present mode */
body.present .top,body.present .noshow{display:none!important}
body.present main{padding-block:16px}
body.present .qtext{font-size:clamp(1.4rem,3.2vw,2.6rem)}
body.present .ans .a{font-size:clamp(1rem,2vw,1.5rem)}
body.present .bars{height:30vh}

.link-btn{border:0;color:inherit;cursor:pointer;font:inherit;font-size:.78rem;font-weight:600}
.link-btn.on i{background:#6fe0a6}
.modal{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:min(460px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.qr{background:#fff;padding:14px;border-radius:10px;justify-self:center;line-height:0}
.qr img,.qr canvas{width:220px;height:220px;max-width:100%}
.code{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-align:center}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted);font-size:.9rem}
/* Full-screen scanner: always dark, it sits on a live camera image */
.scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff}
.sc-view{position:absolute;inset:0}
.sc-view video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#scCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc-top{position:absolute;left:0;right:0;top:0;display:flex;gap:12px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
.sc-mid{flex:1;min-width:0}
.sc-q{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.sc-prog{height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.sc-prog span{display:block;height:100%;background:#33e08a;transition:width .25s}
.sc-count{text-align:right;font-family:var(--f-mono);line-height:1}
.sc-count b{font-size:1.7rem;font-variant-numeric:tabular-nums}
.sc-count small{display:block;opacity:.7;font-size:.7rem;margin-top:3px}
.sc-bottom{position:absolute;left:0;right:0;bottom:0;padding:24px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8) 35%);display:grid;gap:10px}
.sc-miss{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;font-size:.8rem;align-items:center;white-space:nowrap}
.sc-miss::-webkit-scrollbar{display:none}
.sc-lab{font-weight:700;opacity:.85}
.sc-m{background:rgba(255,255,255,.14);border-radius:6px;padding:3px 7px}
.sc-m b{font-family:var(--f-mono);margin-right:3px}
.sc-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.sc-btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:11px 14px;font-weight:600;font-size:.95rem;cursor:pointer;flex:1 1 auto;backdrop-filter:blur(6px)}
.sc-top .sc-btn{flex:none;width:42px;height:42px;padding:0;font-size:1.1rem}
.sc-btn.chalk{background:#f2c84b;color:#2e2400;border-color:#f2c84b}
.sc-btn[disabled]{opacity:.35}
.sc-btn[aria-pressed="true"]{background:#fff;color:#000}
.sc-fail{position:absolute;inset:0;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:#0f1613}
.sc-card{max-width:440px;background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;display:grid;gap:10px}
.sc-card p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.xl{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border:1px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.xl>div{min-width:0;flex:1 1 240px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top wrap noshow">
  <div class="inner">
    <div class="brand">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true"><canvas id="logoCv" width="26" height="26"></canvas></div>
        <h1>Giơ Thẻ<small>Thẻ trả lời giấy · quét bằng camera</small></h1>
      </div>
      <div class="row" style="gap:8px"><button class="sync link-btn" id="linkBtn" data-act="link" hidden><i></i><span>Kết nối điện thoại</span></button><div class="sync" id="sync"><i></i><span>Lưu trên máy này</span></div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap"><div class="inner" id="view"></div></main>
<div id="scanner" class="scanner" hidden role="dialog" aria-label="Quét thẻ bằng camera">
  <div id="scView" class="sc-view">
    <video id="svid" playsinline muted autoplay></video>
    <canvas id="scCanvas"></canvas>
    <div class="sc-top">
      <button class="sc-btn" data-act="scClose" aria-label="Đóng camera">✕</button>
      <div class="sc-mid"><div id="scQ" class="sc-q">Câu 1</div><div class="sc-prog"><span id="scBar"></span></div></div>
      <div class="sc-count"><b id="scN">0/0</b><small>thẻ</small></div>
    </div>
    <div class="sc-bottom">
      <div class="sc-miss" id="scMiss"></div>
      <div class="sc-ctrl">
        <button class="sc-btn" id="scPrev" data-act="prevQ">← Câu trước</button>
        <button class="sc-btn chalk" id="scReveal" data-act="reveal">Hiện đáp án</button>
        <button class="sc-btn" id="scNext" data-act="nextQ">Câu sau →</button>
        <button class="sc-btn" id="scTorch" data-act="scTorch" aria-pressed="false" hidden>🔦</button>
      </div>
    </div>
  </div>
  <div id="scFail" class="sc-fail" hidden>
    <div class="sc-card">
      <h3>Chưa mở được camera trực tiếp</h3>
      <p id="scFailWhy"></p>
      <p>Bạn vẫn quét được ngay bây giờ: bấm <b>Chụp ảnh lớp</b> — điện thoại mở camera, chụp một tấm là app đọc toàn bộ thẻ trong ảnh.</p>
      <div class="row"><button class="btn primary big" data-act="scShoot">📷 Chụp ảnh lớp</button><button class="btn" data-act="scClose">Đóng</button></div>
    </div>
  </div>
</div>
<div id="linkModal" class="modal" hidden role="dialog" aria-labelledby="linkTitle">
  <div class="modal-card">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><h3 id="linkTitle">Kết nối điện thoại</h3><button class="btn ghost" data-act="linkClose" aria-label="Đóng">✕</button></div>
    <div id="linkBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="photoLib" accept="image/*" multiple hidden>
<input type="file" id="docxIn" accept=".docx,.txt" hidden>
<input type="file" id="backupIn" accept=".json" hidden>
<input type="file" id="xlsIn" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>

<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);

/* ================= store (local + optional synced db) ================= */
const S = { classes:{}, quizzes:{}, sessions:{}, live:null, deleted:{} };
const LS_KEY = "giothe.v1";
let dbCol = null, synced = false;
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d){ Object.assign(S,d); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
const KIND = { c:"classes", q:"quizzes", s:"sessions" };
// per-document write queue: one write at a time, latest wins
const wq = {};
function queueWrite(id, fn){
  const w = wq[id] || (wq[id] = {busy:false, next:null});
  w.next = fn;
  if (w.busy) return;
  (async function run(){
    w.busy = true;
    while (w.next){ const f=w.next; w.next=null; try{ await f(); }catch(e){ console.warn("db write", e); if(e&&e.code==="quota_exceeded") toast("Bộ nhớ đồng bộ đã đầy — hãy xoá bớt buổi học cũ."); } }
    w.busy = false;
  })();
}
function put(kind, obj, fromPeer){
  if(!fromPeer) obj.updated = Date.now();
  S[KIND[kind]][obj.id] = obj; saveLocal();
  if(!fromPeer) peerSend({t:"put", kind, obj});
  if (dbCol){ const ref=dbCol.doc(kind+"-"+obj.id); const data=JSON.parse(JSON.stringify(obj)); data.kind=kind; queueWrite(ref.path, ()=>ref.set(data)); }
}
function del(kind, id, fromPeer){
  delete S[KIND[kind]][id]; S.deleted=S.deleted||{}; S.deleted[id]=Date.now(); saveLocal();
  if(!fromPeer) peerSend({t:"del", kind, id});
  if (dbCol){ const ref=dbCol.doc(kind+"-"+id); queueWrite(ref.path, ()=>ref.delete()); }
}
function setLive(live, fromPeer){
  if (live && !fromPeer) live.updated = Date.now();
  S.live = live; saveLocal();
  if(!fromPeer) peerSend({t:"live", live});
  if (dbCol){ const ref=dbCol.doc("live"); queueWrite(ref.path, ()=> live ? ref.set(live) : ref.delete()); }
}
// record answers into a session (merge-safe for two devices)
const pendingAns = {};
function recordAnswers(sid, qi, map, fromPeer){
  const s = S.sessions[sid]; if(!s) return;
  s.answers = s.answers || {}; s.answers[qi] = Object.assign({}, s.answers[qi]||{}, map);
  saveLocal();
  if(!fromPeer) peerSend({t:"ans", sid, qi, map});
  if (dbCol){
    const key = sid+"|"+qi; pendingAns[key] = Object.assign(pendingAns[key]||{}, map);
    const ref = dbCol.doc("s-"+sid);
    queueWrite(ref.path+"#a", async ()=>{ const m=pendingAns[key]; delete pendingAns[key]; if(m) await ref.update({answers:{[qi]:m}}); });
  }
}
async function initSync(){
  if (!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbCol = db.collection("data/users/"+id);
    let first = true;
    dbCol.onSnapshot(snap => {
      const next = { classes:{}, quizzes:{}, sessions:{}, live:null };
      snap.docs.forEach(d => { const v=d.data(); if(!v) return;
        if (d.id==="live") next.live = v;
        else if (KIND[v.kind]) next[KIND[v.kind]][v.id] = v; });
      if (first && snap.empty && (Object.keys(S.classes).length||Object.keys(S.quizzes).length)){
        // first sync on this account: carry over what this browser already had
        Object.values(S.classes).forEach(o=>put("c",o)); Object.values(S.quizzes).forEach(o=>put("q",o)); Object.values(S.sessions).forEach(o=>put("s",o));
        first=false; return;
      }
      first = false;
      // keep local answers that have not been confirmed yet
      Object.values(next.sessions).forEach(s=>{ const loc=S.sessions[s.id]; if(loc&&loc.answers){ s.answers = s.answers? JSON.parse(JSON.stringify(s.answers)) : {}; for(const qi in loc.answers){ s.answers[qi]=Object.assign({}, loc.answers[qi], s.answers[qi]||{}); } } });
      S.classes=next.classes; S.quizzes=next.quizzes; S.sessions=next.sessions; S.live=next.live; saveLocal();
      synced = true; setSync(); onRemoteChange();
    }, err => { console.warn(err); dbCol=null; synced=false; setSync(); });
  }catch(e){ console.warn(e); }
}
function setSync(){
  const el=$("#sync"); el.classList.toggle("on", synced);
  el.querySelector("span").textContent = synced ? "Đồng bộ máy tính ⇄ điện thoại" : "Lưu trên máy này";
}

/* ================= marker dictionary + card drawing ================= */
let DICT=null;
function dict(){ if(!DICT && window.AR){ DICT = new AR.Dictionary("ARUCO_MIP_36h12"); } return DICT; }
function markerBits(id){ const d=dict(); return d ? d.codeList[id] : null; }
// draws one answer card. (x,y,w,h) in px. A on top, B right, C bottom, D left.
function drawCard(ctx, x, y, w, h, num, name, opts={}){
  ctx.save();
  ctx.fillStyle="#fff"; ctx.fillRect(x,y,w,h);
  if (opts.cut){ ctx.strokeStyle="#bbb"; ctx.setLineDash([6,6]); ctx.lineWidth=Math.max(1,w/400); ctx.strokeRect(x+.5,y+.5,w-1,h-1); ctx.setLineDash([]); }
  const m = Math.min(w,h)*0.66, cell=m/8, mx=x+(w-m)/2, my=y+(h-m)/2;
  ctx.fillStyle="#000"; ctx.fillRect(mx,my,m,m);
  const bits = markerBits(num);
  if (bits){ ctx.fillStyle="#fff";
    for(let r=0;r<6;r++) for(let c=0;c<6;c++) if(bits[r*6+c]==="1") ctx.fillRect(mx+(c+1)*cell-0.25, my+(r+1)*cell-0.25, cell+0.5, cell+0.5); }
  const fs = Math.min(w,h)*0.055, gap = (Math.min(w,h)-m)/4;
  ctx.fillStyle="#222"; ctx.font=`700 ${fs}px ${opts.font||"Arial"}`; ctx.textAlign="center"; ctx.textBaseline="middle";
  const cx=x+w/2, cy=y+h/2;
  const put1=(L,px,py,rot)=>{ ctx.save(); ctx.translate(px,py); ctx.rotate(rot); ctx.fillText(L,0,0); ctx.restore(); };
  put1("A", cx, my-gap, 0);
  put1("B", mx+m+gap, cy, Math.PI/2);
  put1("C", cx, my+m+gap, Math.PI);
  put1("D", mx-gap, cy, -Math.PI/2);
  // number + name, small, top-left (reads upright with A on top)
  const s2 = Math.min(w,h)*0.045;
  ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillStyle="#333";
  ctx.font=`700 ${s2}px ${opts.font||"Arial"}`; ctx.fillText(String(num), x+s2*0.9, y+s2*0.8);
  if (name){ ctx.font=`500 ${s2*0.8}px ${opts.font||"Arial"}`; ctx.fillStyle="#666"; ctx.fillText(name.slice(0,26), x+s2*0.9, y+s2*2.0); }
  if (opts.big){ // shared deck: big number on bottom-left corner, reads with C up? keep upright with A on top
    ctx.font=`700 ${s2*1.8}px ${opts.font||"Arial"}`; ctx.fillStyle="#999"; ctx.textAlign="right"; ctx.textBaseline="bottom";
    ctx.fillText(String(num), x+w-s2*0.9, y+h-s2*0.6);
  }
  ctx.restore();
}

/* ================= detection ================= */
let DET=null;
function detector(){ if(!DET && window.AR) DET=new AR.Detector({dictionaryName:"ARUCO_MIP_36h12", maxHammingDistance:4}); return DET; }
function answerFromCorners(c){
  const dx=c[1].x-c[0].x, dy=c[1].y-c[0].y;
  if (Math.abs(dx)>=Math.abs(dy)) return dx>0?"A":"C";
  return dy<0?"B":"D";
}
// detect on a canvas; returns [{id, ans, corners(in canvas coords)}]
function detectCanvas(cv, maxCards=999){
  const det=detector(); if(!det) return [];
  const found = new Map();
  const passes = [Math.min(1, 2000/Math.max(cv.width,cv.height)), Math.min(1, 1200/Math.max(cv.width,cv.height))];
  for (const sc of [...new Set(passes.map(p=>+p.toFixed(3)))]){
    const w=Math.round(cv.width*sc), h=Math.round(cv.height*sc);
    const t=document.createElement("canvas"); t.width=w; t.height=h;
    const tc=t.getContext("2d",{willReadFrequently:true}); tc.drawImage(cv,0,0,w,h);
    const img=tc.getImageData(0,0,w,h);
    let ms=[]; try{ ms=det.detect(img); }catch(e){ console.warn(e); }
    for (const mk of ms){
      if (mk.id<1 || mk.id>maxCards) continue;
      if (found.has(mk.id)) continue;
      found.set(mk.id, {id:mk.id, ans:answerFromCorners(mk.corners), corners:mk.corners.map(p=>({x:p.x/sc,y:p.y/sc}))});
    }
  }
  return [...found.values()];
}

/* ================= quiz parser (Word / pasted) =================
   fmt (optional) = per-character formatting bits from the Word file:
   1 coloured text, 2 highlight/shading, 4 underline, 8 bold, 16 italic.
   The correct option is the one formatted differently from the other three. */
const F_COLOR=1,F_HL=2,F_U=4,F_B=8,F_I=16;
function parseQuiz(text, fmt){
  text = text.replace(/\r/g,"").replace(/ /g," ");
  if (fmt && fmt.length!==text.length) fmt=null;
  // answer key at the end: "Đáp án: 1B 2C 3-A" / "BẢNG ĐÁP ÁN" table
  const key={}; let end=text.length;
  const keys=[...text.matchAll(/(?:^|\n)[ \t]*(?:bảng\s*)?đáp\s*án\s*(?:[:\n]|$)/gi)].filter(m=>!/Câu\s*\d/i.test(text.slice(m.index+m[0].length)));
  const km=keys[0];
  if (km){ const tail=text.slice(km.index+km[0].length);
    if (/\d+\s*[-.:)]?\s*[A-D]\b/i.test(tail)){ tail.replace(/(\d+)\s*[-.:)]?\s*([A-D])\b/gi,(_,n,l)=>{ key[+n]=LET.indexOf(l.toUpperCase()); }); end=km.index; } }
  // question starts: "Câu 12:" (or "12." lines when the file has no "Câu")
  let starts=[...text.slice(0,end).matchAll(/(^|\n)[ \t]*Câu\s*(\d+)\s*[:.)]?/gi)].map(m=>({n:+m[2], at:m.index+m[1].length, body:m.index+m[0].length}));
  if (!starts.length) starts=[...text.slice(0,end).matchAll(/(^|\n)[ \t]*(\d{1,3})\s*[.)]\s/g)].map(m=>({n:+m[2], at:m.index+m[1].length, body:m.index+m[0].length}));
  const qs=[];
  starts.forEach((st,qi)=>{
    const bEnd = qi+1<starts.length? starts[qi+1].at : end;
    let body=text.slice(st.body,bEnd); const base=st.body;
    let correct=-1, how="";
    const ln = body.match(/\n[ \t]*(?:đáp\s*án|chọn)\s*(?:đúng)?\s*[:\-]?\s*\*?\s*([A-D])\b/i);
    if (ln){ correct=LET.indexOf(ln[1].toUpperCase()); how="line"; body=body.slice(0,ln.index); }
    const re=/(^|\n|[ \t])(\*?)[ \t]*([A-D])[ \t]*[.):][ \t]?/g; let m; const marks=[];
    while((m=re.exec(body))){ const L=m[3]; if(marks.length===LET.indexOf(L)) marks.push({letterAt:m.index+m[1].length+m[2].length+(m[0].slice(m[1].length+m[2].length).search(/[A-D]/)), idx:m.index+m[1].length, start:re.lastIndex, star:!!m[2]}); }
    if (marks.length<2) return;
    const opts = marks.map((mk,j)=>{ const e = j+1<marks.length? marks[j+1].idx : body.length; return {s:mk.idx, e, text:body.slice(mk.start,e)}; });
    if (correct<0){ const j=marks.findIndex(x=>x.star); if(j>=0){ correct=j; how="star"; } }
    if (correct<0 && fmt){
      for (const bit of [F_HL,F_COLOR,F_U,F_B,F_I]){
        const has = opts.map((o,j)=>{ let n=0,k=0; for(let i=o.s;i<o.e;i++){ if(/\s/.test(body[i])) continue; n++; if(fmt[base+i]&bit) k++; }
          return (n && k/n>=0.6) || !!(fmt[base+marks[j].letterAt]&bit); });
        if (has.filter(Boolean).length===1){ correct=has.indexOf(true); how="format"; break; }
      }
    }
    if (correct<0 && key[st.n]!=null){ correct=key[st.n]; how="key"; }
    const clean=s=>s.replace(/\s+/g," ").trim();
    const o=opts.map(x=>clean(x.text)); while(o.length<4) o.push("");
    qs.push({id:uid(), t:clean(body.slice(0,marks[0].idx)), o:o.slice(0,4), c:correct<0?0:correct, unsure:correct<0});
  });
  return qs;
}
// read a .docx directly so colour, highlight, underline and bold survive
async function docxRead(file){
  if (!window.JSZip) throw new Error("no jszip");
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const xml = await zip.file("word/document.xml")?.async("string");
  if (!xml) throw new Error("not a docx");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const attr=(el,n)=> el ? (el.getAttributeNS(W,n) ?? el.getAttribute("w:"+n)) : null;
  const child=(el,n)=> el ? [...el.children].find(c=>c.localName===n) : null;
  const on=(el)=>{ if(!el) return false; const v=attr(el,"val"); return v==null || !/^(0|false|none|off)$/i.test(v); };
  let text="", fmt=[];
  const push=(t,f)=>{ text+=t; for(let i=0;i<t.length;i++) fmt.push(f); };
  for (const p of doc.getElementsByTagNameNS(W,"p")){
    for (const r of p.getElementsByTagNameNS(W,"r")){
      if (r.parentElement && r.parentElement.localName==="del") continue;
      const pr=child(r,"rPr"); let f=0;
      const col=attr(child(pr,"color"),"val"); if (col && !/^(auto|0{6}|000000)$/i.test(col)) f|=F_COLOR;
      const hl=child(pr,"highlight"); if (hl && !/^none$/i.test(attr(hl,"val")||"")) f|=F_HL;
      const shd=attr(child(pr,"shd"),"fill"); if (shd && !/^(auto|ffffff)$/i.test(shd)) f|=F_HL;
      const u=child(pr,"u"); if (u && !/^none$/i.test(attr(u,"val")||"single")) f|=F_U;
      if (on(child(pr,"b"))) f|=F_B;
      if (on(child(pr,"i"))) f|=F_I;
      for (const c of r.children){
        if (c.localName==="t") push(c.textContent, f);
        else if (c.localName==="tab") push(" ", f);
        else if (c.localName==="br" || c.localName==="cr") push("\n", 0);
      }
    }
    // table cells: each cell is its own paragraph, keep options apart
    push("\n", 0);
  }
  return {text, fmt};
}

async function makePdf(){
  const c=S.classes[ui.classId];
  const n = ui.cardMode==="class" ? c.students.length : ui.deckSize;
  if (!window.jspdf){ toast("Không tải được thư viện PDF. Kiểm tra mạng."); return; }
  toast("Đang tạo PDF…");
  await new Promise(r=>setTimeout(r,30));
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4", orientation:"portrait"});
  const W=210,H=297, pp=ui.perPage;
  const slots = pp===1 ? [[0,0,W,H]] : pp===2 ? [[0,0,W,H/2],[0,H/2,W,H/2]] : [[0,0,W/2,H/2],[W/2,0,W/2,H/2],[0,H/2,W/2,H/2],[W/2,H/2,W/2,H/2]];
  const px=12; // px per mm (~300dpi)
  for (let i=1;i<=n;i++){
    const k=(i-1)%pp; if(k===0 && i>1) pdf.addPage();
    const [x,y,w,h]=slots[k];
    const side=Math.min(w,h)-8; const cv=document.createElement("canvas"); cv.width=cv.height=Math.round(side*px);
    drawCard(cv.getContext("2d"),0,0,cv.width,cv.height,i, ui.cardMode==="class"?c.students[i-1]:"", {font:"Be Vietnam Pro, Arial", big:ui.cardMode==="deck"});
    pdf.addImage(cv.toDataURL("image/png"),"PNG", x+(w-side)/2, y+(h-side)/2, side, side, undefined, "FAST");
    if (pp>1){ pdf.setLineDashPattern([2,2],0); pdf.setDrawColor(190); if(k===0||k===2&&pp===4){} }
  }
  if (pp===2||pp===4){ for(let p=1;p<=pdf.getNumberOfPages();p++){ pdf.setPage(p); pdf.setLineDashPattern([2,2],0); pdf.setDrawColor(190); pdf.line(0,H/2,W,H/2); if(pp===4) pdf.line(W/2,0,W/2,H); } }
  const name = ui.cardMode==="class" ? `the-tra-loi-${(c.name||"lop").replace(/[^\w\-]+/g,"_")}.pdf` : `bo-the-chung-${n}.pdf`;
  await saveFile(name, pdf.output("blob"));
}
async function saveFile(filename, data){
  try{
    const dl = window.claude && window.claude.use ? await claude.use("downloads") : null;
    if (dl){ await dl.save({filename, data}); toast("Đã lưu "+filename); return; }
  }catch(e){ if(e&&e.code==="declined") return; console.warn(e); }
  try{ const blob = data instanceof Blob? data : new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
  catch(e){ toast("Trình duyệt này không cho tải tệp."); }
}

/* scanning: photos */
async function handlePhotos(files){
  const L=S.live; if(!L||!files.length) return;
  const s=S.sessions[L.sid], c=S.classes[s.classId];
  setMsg("Đang quét…");
  let total=0, merged={};
  for (const f of files){
    const img = await loadImage(f); if(!img){ setMsg("Không mở được ảnh này."); continue; }
    const cv=document.createElement("canvas"); const sc=Math.min(1, 2400/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    await new Promise(r=>setTimeout(r,20));
    const found=detectCanvas(cv, c.students.length);
    found.forEach(m=>merged[m.id]=m.ans); total+=found.length;
    ui.lastShot={cv, found};
  }
  const qi=S.live.qi; if (Object.keys(merged).length) recordAnswers(s.id, qi, merged);
  const n=Object.keys(merged).length;
  const missing=c.students.map((_,i)=>i+1).filter(i=>!((s.answers||{})[qi]||{})[i]);
  setMsg(n? `Đã đọc ${n} thẻ trong ảnh.${missing.length?` Còn thiếu: ${missing.slice(0,12).join(", ")}${missing.length>12?"…":""}`:" Đủ cả lớp!"}`
           : "Không thấy thẻ nào. Chụp gần hơn, đủ sáng, thẻ không bị che.");
  const sh=$("#shot"); if(sh){ sh.hidden=false; if(!$("#shotCv")) sh.innerHTML=`<canvas id="shotCv"></canvas>`; }
  drawLastShot(); updateLivePanels();
}
function setMsg(t){ ui.scanMsg=t; const el=$("#scanMsg"); if(el) el.textContent=t; }
function loadImage(file){ return new Promise(res=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ res(im); }; im.onerror=()=>res(null); im.src=u; }); }
function drawOverlay(ctx, found, scale, c){
  const lw=Math.max(2,3*scale);
  for (const m of found){
    const p=m.corners.map(q=>({x:q.x*scale,y:q.y*scale}));
    ctx.strokeStyle="#33e08a"; ctx.lineWidth=lw; ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.closePath(); ctx.stroke();
    const cx=p.reduce((a,q)=>a+q.x,0)/4, cy=Math.min(...p.map(q=>q.y));
    const lab=`${m.id}·${m.ans}`; const fs=Math.max(12, 16*scale);
    ctx.font=`700 ${fs}px JetBrains Mono, monospace`; const tw=ctx.measureText(lab).width;
    ctx.fillStyle="#f2c84b"; ctx.fillRect(cx-tw/2-4, cy-fs-8, tw+8, fs+6);
    ctx.fillStyle="#2e2400"; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(lab, cx, cy-4);
  }
}
function drawLastShot(){
  const cvOut=$("#shotCv"); if(!cvOut||!ui.lastShot) return;
  const {cv, found}=ui.lastShot; const sc=Math.min(1, 1400/cv.width);
  cvOut.width=Math.round(cv.width*sc); cvOut.height=Math.round(cv.height*sc);
  const ctx=cvOut.getContext("2d"); ctx.drawImage(cv,0,0,cvOut.width,cvOut.height); drawOverlay(ctx, found, sc);
}

/* scanning: full-screen live camera scanner */
let stream=null, camLoop=null, wakeLock=null, torchOn=false;
const seen = {}; // id -> {ans, hits, t}
function scannerEl(){ return $("#scanner"); }
async function openScanner(){
  const L=S.live; if(!L) return;
  ui.cam=true; const el=scannerEl(); el.hidden=false; document.body.style.overflow="hidden";
  $("#scFail").hidden=true; $("#scView").hidden=false;
  updateScannerHud();
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no-media");
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}});
  }catch(e){
    console.warn(e); stream=null;
    $("#scView").hidden=true; $("#scFail").hidden=false;
    $("#scFailWhy").textContent = (e && e.name==="NotAllowedError")
      ? "Camera đang bị chặn. Trong trang Claude, camera trực tiếp không được cấp quyền; ở bản web riêng, hãy cho phép camera trong cài đặt trình duyệt."
      : "Không mở được camera trực tiếp ở đây.";
    return;
  }
  const v=$("#svid"); v.srcObject=stream; try{ await v.play(); }catch(e){}
  try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){}
  const track=stream.getVideoTracks()[0]; const caps=track.getCapabilities?.()||{};
  $("#scTorch").hidden = !caps.torch;
  for (const k in seen) delete seen[k];
  runScanLoop();
}
function closeScanner(){
  ui.cam=false; if(camLoop) cancelAnimationFrame(camLoop); camLoop=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ wakeLock?.release(); }catch(e){} wakeLock=null; torchOn=false;
  const el=scannerEl(); if(el) el.hidden=true; document.body.style.overflow="";
  if (ui.tab==="buoi") render();
}
function stopCam(){ closeScanner(); }
async function toggleTorch(){
  const track=stream?.getVideoTracks()[0]; if(!track) return;
  torchOn=!torchOn; try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ torchOn=false; }
  $("#scTorch").setAttribute("aria-pressed", torchOn);
}
function runScanLoop(){
  const v=$("#svid"), view=$("#scCanvas"), work=document.createElement("canvas");
  let lastDet=0, found=[], fr={sx:0,sy:0,sw:1,sh:1};
  const tick=(t)=>{
    if(!ui.cam||!S.live||!stream) return;
    camLoop=requestAnimationFrame(tick);
    if(!v.videoWidth) return;
    // size display canvas to screen (device pixels), draw video "cover"
    const dpr=Math.min(2,window.devicePixelRatio||1), W=Math.round(view.clientWidth*dpr), H=Math.round(view.clientHeight*dpr);
    if(view.width!==W||view.height!==H){ view.width=W; view.height=H; }
    const vr=v.videoWidth/v.videoHeight, cr=W/H;
    if (vr>cr){ fr.sh=v.videoHeight; fr.sw=fr.sh*cr; fr.sx=(v.videoWidth-fr.sw)/2; fr.sy=0; } else { fr.sw=v.videoWidth; fr.sh=fr.sw/cr; fr.sx=0; fr.sy=(v.videoHeight-fr.sh)/2; }
    const ctx=view.getContext("2d"); ctx.drawImage(v,fr.sx,fr.sy,fr.sw,fr.sh,0,0,W,H);
    if (t-lastDet>140){
      lastDet=t;
      const s=S.sessions[S.live.sid], c=S.classes[s.classId];
      const sc=Math.min(1,1280/Math.max(fr.sw,fr.sh)); work.width=Math.round(fr.sw*sc); work.height=Math.round(fr.sh*sc);
      work.getContext("2d").drawImage(v,fr.sx,fr.sy,fr.sw,fr.sh,0,0,work.width,work.height);
      found=detectCanvas(work, c.students.length).map(m=>({...m, corners:m.corners.map(q=>({x:q.x*W/work.width, y:q.y*H/work.height}))}));
      acceptFrame(found, t);
    }
    drawLiveOverlay(ctx, found, dpr);
  };
  camLoop=requestAnimationFrame(tick);
}
// a reading must repeat in 2 frames (3 to change an answer already recorded) before it counts
function acceptFrame(found, t){
  const L=S.live, s=S.sessions[L.sid]; const cur=(s.answers||{})[L.qi]||{}; const ch={}; let fresh=0;
  for (const m of found){
    const k=seen[m.id];
    if (k && k.ans===m.ans && t-k.t<1500) k.hits++; else seen[m.id]={ans:m.ans,hits:1};
    seen[m.id].t=t;
    const need = cur[m.id] ? 3 : 2;
    if (seen[m.id].hits>=need && cur[m.id]!==m.ans){ ch[m.id]=m.ans; if(!cur[m.id]) fresh++; }
  }
  if (Object.keys(ch).length){
    recordAnswers(s.id, L.qi, ch);
    if (fresh){ try{ navigator.vibrate?.(25); }catch(e){} beep(); }
    updateScannerHud(); updateLivePanels();
  }
}
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=1320; g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.09); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.1); }catch(e){} }
function drawLiveOverlay(ctx, found, dpr){
  const L=S.live, s=S.sessions[L.sid]; const cur=(s.answers||{})[L.qi]||{};
  const q=S.quizzes[s.quizId]; const Q=q?.questions.find(x=>x.id===s.qids[L.qi]);
  for (const m of found){
    const rec=cur[m.id]===m.ans; const p=m.corners;
    const ok = L.reveal && Q ? LET.indexOf(m.ans)===Q.c : null;
    const col = !rec ? "#ffffff" : ok===false ? "#ff6b5e" : "#33e08a";
    ctx.lineWidth=3*dpr; ctx.strokeStyle=col; ctx.fillStyle=rec? col+"33" : "transparent";
    ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.closePath(); ctx.fill(); ctx.stroke();
    const cx=p.reduce((a,q)=>a+q.x,0)/4, top=Math.min(...p.map(q=>q.y));
    const lab = rec ? `${m.id} · ${m.ans}` : `${m.id} …`; const fs=14*dpr;
    ctx.font=`700 ${fs}px JetBrains Mono, monospace`; const tw=ctx.measureText(lab).width;
    ctx.fillStyle=rec? col : "rgba(0,0,0,.6)"; ctx.fillRect(cx-tw/2-6*dpr, top-fs-12*dpr, tw+12*dpr, fs+8*dpr);
    ctx.fillStyle=rec? "#06150d" : "#fff"; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(lab, cx, top-7*dpr);
  }
}
function updateScannerHud(){
  const L=S.live; if(!L||!scannerEl()||scannerEl().hidden) return;
  const s=S.sessions[L.sid], c=S.classes[s.classId], q=S.quizzes[s.quizId];
  const qs=s.qids.map(id=>q?.questions.find(x=>x.id===id)).filter(Boolean); const qi=Math.min(L.qi,qs.length-1);
  const a=(s.answers||{})[qi]||{}; const total=c.students.length; const n=Object.keys(a).length;
  $("#scQ").textContent=`Câu ${qi+1}/${qs.length}`;
  $("#scN").textContent=`${n}/${total}`;
  $("#scBar").style.width=(total?100*n/total:0)+"%";
  $("#scPrev").disabled=qi===0; $("#scNext").disabled=qi>=qs.length-1;
  $("#scReveal").textContent=L.reveal?"Ẩn đáp án":"Hiện đáp án";
  const miss=c.students.map((nm,i)=>({i:i+1,nm})).filter(x=>!a[x.i]);
  $("#scMiss").innerHTML = miss.length ? `<span class="sc-lab">Chưa quét (${miss.length}):</span>`+miss.map(x=>`<span class="sc-m"><b>${x.i}</b> ${esc(x.nm.split(" ").slice(-2).join(" "))}</span>`).join("")
    : `<span class="sc-lab" style="color:#33e08a">✓ Đã đủ cả lớp</span>`;
}

function csvOf(s){
  const c=S.classes[s.classId], q=S.quizzes[s.quizId]; const qs=s.qids.map(id=>q?.questions.find(x=>x.id===id)).filter(Boolean);
  const cell=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[["Số thẻ","Họ và tên",...qs.map((_,i)=>"Câu "+(i+1)),"Số câu đúng","Điểm 10"].map(cell).join(",")];
  lines.push(["","Đáp án đúng",...qs.map(Q=>LET[Q.c]),"",""].map(cell).join(","));
  (c?.students||[]).forEach((nm,i)=>{ let ok=0; const a=qs.map((Q,qi)=>{ const v=((s.answers||{})[qi]||{})[i+1]||""; if(v&&LET.indexOf(v)===Q.c) ok++; return v; });
    lines.push([i+1,nm,...a,ok,(qs.length?10*ok/qs.length:0).toFixed(1)].map(cell).join(",")); });
  return "﻿"+lines.join("\r\n");
}

    case "delRes": ui.confirm="delRes"; return render();
    case "delResYes": del("s",ui.resultId); ui.resultId=null; ui.confirm=null; return render();
    case "backup": return saveFile(`gio-the-sao-luu-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({classes:S.classes,quizzes:S.quizzes,sessions:S.sessions},null,1));
    case "restore": return $("#backupIn").click();
    case "exitPresent": document.body.classList.remove("present"); try{ document.fullscreenElement && document.exitFullscreen(); }catch(_){} $("#exitP")?.remove(); return;
  }
});
function ensureExitBtn(){ if($("#exitP")) return; const b=document.createElement("button"); b.id="exitP"; b.className="btn"; b.dataset.act="exitPresent"; b.textContent="Thoát trình chiếu";
  b.style.cssText="position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:15;opacity:.7"; document.body.appendChild(b); }
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement && document.body.classList.contains("present")){ document.body.classList.remove("present"); $("#exitP")?.remove(); } });
document.addEventListener("keydown", e=>{
  if (ui.tab!=="buoi"||!S.live||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (e.key==="ArrowRight") $('[data-act="nextQ"]')?.click();
  if (e.key==="ArrowLeft") $('[data-act="prevQ"]')?.click();
  if (e.key===" "){ e.preventDefault(); $('[data-act="reveal"]')?.click(); }
});
$("#photoIn").addEventListener("change", e=>{ handlePhotos([...e.target.files]); e.target.value=""; });
$("#photoLib").addEventListener("change", e=>{ handlePhotos([...e.target.files]); e.target.value=""; });
$("#docxIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if (/\.doc$/i.test(f.name)){ toast("Tệp .doc (Word cũ) chưa đọc được. Mở bằng Word → Lưu thành .docx rồi chọn lại."); return; }
  try{
    toast("Đang đọc tệp…");
    const r = /\.txt$/i.test(f.name) ? {text:await f.text(), fmt:null} : await docxRead(f);
    const qs=parseQuiz(r.text, r.fmt);
    if(!qs.length){ toast("Không tìm thấy câu trắc nghiệm nào. Mỗi câu cần bắt đầu bằng “Câu 1:” và có A. B. C. D."); return; }
    newQuizFrom(f.name.replace(/\.(docx|txt)$/i,""), qs);
    const un=qs.filter(x=>x.unsure).length;
    toast(un? `Đã tách ${qs.length} câu · ${qs.length-un} câu có đáp án · ${un} câu cần chọn đáp án` : `Đã tách ${qs.length} câu, đủ đáp án`);
  }catch(err){ console.warn(err); toast("Không đọc được tệp này. Hãy lưu lại dạng .docx rồi thử lại."); }
});
$("#backupIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const d=JSON.parse(await f.text()); let n=0;
    Object.values(d.classes||{}).forEach(o=>{put("c",o);n++}); Object.values(d.quizzes||{}).forEach(o=>{put("q",o);n++}); Object.values(d.sessions||{}).forEach(o=>{put("s",o);n++});
    render(); toast(`Đã khôi phục ${n} mục`); }catch(err){ toast("Tệp sao lưu không hợp lệ."); }
});

/* ================= phone ⇄ computer link (peer-to-peer, for the stand-alone web version) ================= */
const LINK_KEY="giothe.link";
const link = { peer:null, conns:[], role:null, code:null, status:"off", retry:null };
const inClaudeView = () => !!(window.claude && window.claude.use);
function linkSupported(){ return !!window.Peer && !inClaudeView() && window.RTCPeerConnection; }
function linkStore(v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(LINK_KEY)||"null"); localStorage.setItem(LINK_KEY, JSON.stringify(v)); }catch(e){ return null; } }
function newCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<6;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }
const peerId = code => "giothe-app-"+code.toLowerCase();
function peerOpts(){ return Object.assign({debug:0, config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}}, window.GIOTHE_PEER_OPTS||{}); }
function peerSend(msg){ link.conns.forEach(c=>{ try{ if(c.open) c.send(msg); }catch(e){} }); }
function fullState(){ return {t:"full", classes:S.classes, quizzes:S.quizzes, sessions:S.sessions, live:S.live, deleted:S.deleted||{}}; }
function mergeFull(m){
  S.deleted=Object.assign({}, m.deleted||{}, S.deleted||{});
  for (const k of ["classes","quizzes","sessions"]){
    for (const id in (m[k]||{})){
      if (S.deleted[id]) continue;
      const mine=S[k][id], theirs=m[k][id];
      if (!mine || (theirs.updated||0) > (mine.updated||0)){
        const keep = mine && mine.answers; S[k][id]=JSON.parse(JSON.stringify(theirs));
        if (keep){ const a=S[k][id].answers=S[k][id].answers||{}; for(const qi in keep) a[qi]=Object.assign({}, keep[qi], a[qi]||{}); }
      } else if (k==="sessions" && theirs.answers){ const a=mine.answers=mine.answers||{}; for(const qi in theirs.answers) a[qi]=Object.assign({}, theirs.answers[qi], a[qi]||{}); }
    }
    for (const id in S[k]) if (S.deleted[id]) delete S[k][id];
  }
  if (m.live && (!S.live || (m.live.updated||0) > (S.live.updated||0))) S.live=m.live;
  saveLocal();
}
function onPeerMsg(m){
  if (!m || typeof m!=="object") return;
  if (m.t==="full") mergeFull(m);
  else if (m.t==="put" && KIND[m.kind]) put(m.kind, m.obj, true);
  else if (m.t==="del" && KIND[m.kind]) del(m.kind, m.id, true);
  else if (m.t==="live"){ if(!m.live||!S.live||m.live.qi!==S.live.qi) for(const k in seen) delete seen[k]; setLive(m.live, true); if(!m.live && ui.cam) closeScanner(); }
  else if (m.t==="ans") recordAnswers(m.sid, m.qi, m.map, true);
  else return;
  onRemoteChange();
}
function wireConn(conn){
  conn.on("open", ()=>{ link.conns=link.conns.filter(c=>c!==conn&&c.open).concat(conn); conn.send(fullState()); setLinkStatus("on");
    toast(link.role==="host"?"Đã kết nối điện thoại":"Đã kết nối với máy tính");
    if (link.role==="host") setTimeout(()=>{ $("#linkModal").hidden=true; }, 1500); });
  conn.on("data", onPeerMsg);
  const gone=()=>{ link.conns=link.conns.filter(c=>c!==conn); if(!link.conns.length) setLinkStatus(link.role==="host"?"wait":"lost"); if(link.role==="client") scheduleRetry(); };
  conn.on("close", gone); conn.on("error", gone);
}
function startHost(){
  if (!linkSupported()) return;
  if (link.peer && link.role==="host") return showLinkModal();
  stopLink();
  let st=linkStore(); if(!st||st.role!=="host"||!st.code) st={role:"host", code:newCode()};
  link.role="host"; link.code=st.code; linkStore(st);
  link.peer=new Peer(peerId(st.code), peerOpts());
  setLinkStatus("wait"); showLinkModal();
  link.peer.on("connection", conn=>wireConn(conn));
  link.peer.on("error", e=>{ console.warn("peer",e);
    if (e.type==="unavailable-id"){ stopLink(); linkStore({role:"host", code:newCode()}); startHost(); return; }
    if (e.type==="network"||e.type==="server-error"||e.type==="socket-error") { setLinkStatus("err"); } });
  link.peer.on("disconnected", ()=>{ try{ link.peer.reconnect(); }catch(e){} });
}
function startClient(code){
  if (!linkSupported()) return;
  code=String(code||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,""); if(code.length<4) { toast("Mã kết nối gồm 6 ký tự."); return; }
  stopLink();
  link.role="client"; link.code=code; linkStore({role:"client", code});
  link.peer=new Peer("giothe-c-"+uid(), peerOpts());
  setLinkStatus("connecting");
  link.peer.on("open", ()=>{ const conn=link.peer.connect(peerId(code), {reliable:true}); wireConn(conn);
    setTimeout(()=>{ if(link.status==="connecting"){ setLinkStatus("lost"); scheduleRetry(); } }, 15000); });
  link.peer.on("error", e=>{ console.warn("peer", e.type, e.message); if(e.type==="peer-unavailable"){ setLinkStatus("lost"); scheduleRetry(); } else if(link.status!=="on") setLinkStatus("err"); });
  link.peer.on("disconnected", ()=>{ try{ link.peer.reconnect(); }catch(e){} });
}
function scheduleRetry(){
  clearTimeout(link.retry);
  link.retry=setTimeout(()=>{ if(link.role!=="client"||link.status==="on"||!link.peer) return;
    if (link.peer.disconnected){ try{ link.peer.reconnect(); }catch(e){} }
    setLinkStatus("connecting"); const conn=link.peer.connect(peerId(link.code),{reliable:true}); wireConn(conn);
    setTimeout(()=>{ if(link.status==="connecting"){ setLinkStatus("lost"); scheduleRetry(); } }, 12000); }, 5000);
}
function stopLink(forget){
  clearTimeout(link.retry); link.conns.forEach(c=>{try{c.close()}catch(e){}}); link.conns=[];
  try{ link.peer&&link.peer.destroy(); }catch(e){} link.peer=null; link.role=null; setLinkStatus("off");
  if (forget) linkStore(null);
}
function setLinkStatus(st){
  link.status=st; const b=$("#linkBtn"); if(!b) return;
  const n=link.conns.length;
  const txt={off:"Kết nối điện thoại", wait:"Chờ điện thoại… "+(link.code||""), connecting:"Đang kết nối…", on: link.role==="host"?`Đã kết nối ${n} điện thoại`:"Đã kết nối máy tính", lost:"Mất kết nối — đang thử lại", err:"Lỗi kết nối"}[st];
  b.querySelector("span").textContent=txt; b.classList.toggle("on", st==="on");
  if (!$("#linkModal").hidden) renderLinkModal();
}
function linkUrl(){ return location.href.split("#")[0]+"#link-"+link.code; }
function showLinkModal(){ $("#linkModal").hidden=false; renderLinkModal(); }
function renderLinkModal(){
  const body=$("#linkBody"); if(!body) return;
  if (link.role==="host"){
    body.innerHTML = `
      <ol class="steps"><li>Mở <b>Camera</b> (hoặc Zalo → quét mã) trên điện thoại, hướng vào mã QR.</li><li>Chạm vào đường link hiện ra — app mở và tự kết nối.</li><li>Lớp, đề và kết quả quét sẽ đồng bộ giữa hai máy.</li></ol>
      <div class="qr" id="qrBox"></div>
      <div class="small muted" style="text-align:center">Hoặc trên điện thoại mở app → <b>Kết nối điện thoại</b> → nhập mã:</div>
      <div class="code">${esc(link.code)}</div>
      <div class="note small">${link.status==="on"?`✅ Đã kết nối ${link.conns.length} điện thoại.`:link.status==="err"?"Không kết nối được máy chủ trung gian. Kiểm tra mạng Internet rồi thử lại.":"Đang chờ điện thoại… Hai máy nên dùng <b>chung một mạng Wi-Fi</b> để kết nối ổn định nhất."}</div>
      <div class="row"><button class="btn" data-act="linkClose">Xong</button><button class="btn ghost danger" data-act="linkStop">Ngắt kết nối</button></div>`;
    if (window.QRCode){ new QRCode($("#qrBox"), {text:linkUrl(), width:440, height:440, correctLevel:QRCode.CorrectLevel.M}); }
    else $("#qrBox").innerHTML=`<div style="line-height:1.4;color:#333;max-width:220px">${esc(linkUrl())}</div>`;
  } else {
    body.innerHTML = `
      ${link.role==="client"?`<div class="note small">${link.status==="on"?"✅ Đã kết nối với máy tính (mã <b>"+esc(link.code)+"</b>).":link.status==="connecting"?"Đang kết nối với mã <b>"+esc(link.code)+"</b>…":"Chưa kết nối được với mã <b>"+esc(link.code)+"</b>. Kiểm tra máy tính đang mở app và hai máy dùng chung Wi-Fi — app sẽ tự thử lại."}</div>`:""}
      <p class="muted small" style="margin:0">Đây là <b>máy tính</b> (máy trình chiếu)? Bấm “Hiện mã QR” rồi quét bằng điện thoại.<br>Đây là <b>điện thoại</b>? Nhập mã 6 ký tự đang hiện trên máy tính.</p>
      <form id="linkForm" class="row" style="flex-wrap:nowrap"><input type="text" id="linkCode" placeholder="VD: K7M2QX" maxlength="8" autocomplete="off" autocapitalize="characters" style="font-family:var(--f-mono);font-size:1.1rem;letter-spacing:.1em"><button class="btn primary" type="submit">Kết nối</button></form>
      <div class="row"><button class="btn" data-act="linkHost">Hiện mã QR (máy tính)</button>${link.role?`<button class="btn ghost danger" data-act="linkStop">Ngắt kết nối</button>`:""}</div>`;
    $("#linkForm").addEventListener("submit", e=>{ e.preventDefault(); startClient($("#linkCode").value); renderLinkModal(); });
  }
}

/* ================= boot ================= */
loadLocal();
const linkHash = (location.hash.match(/^#link-([A-Za-z0-9]{4,8})$/)||[])[1];
ui.tab = tabFromHash() || (S.live ? "buoi" : "lop");
(function logo(){ const cv=$("#logoCv"); if(!cv) return; const x=cv.getContext("2d"); x.fillStyle="#000"; x.fillRect(1,1,24,24); x.fillStyle="#fff";
  [[1,1],[2,3],[3,1],[4,2],[1,4],[3,4],[4,4],[2,2]].forEach(([c,r])=>x.fillRect(1+c*4.8,1+r*4.8,4.8,4.8)); })();
render();
initSync();
if (linkSupported()){
  $("#linkBtn").hidden=false;
  if (linkHash){ try{ history.replaceState(null,"","#"+ui.tab); }catch(e){} startClient(linkHash); toast("Đang kết nối với máy tính…"); }
  else { const st=linkStore(); if(st&&st.role==="host"&&st.code){ startHost(); $("#linkModal").hidden=true; } else if(st&&st.role==="client"&&st.code) startClient(st.code); }
}
</script>
